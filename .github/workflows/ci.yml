name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 2.31: ręczne uruchomienie z zakładki Actions (przydaje się po awarii
  # runnera – nie trzeba wtedy robić pustego commita).
  workflow_dispatch:
    inputs:
      reference_network_probe:
        description: 'Test połączenia z oryginalnymi plikami (bez uploadu)'
        type: boolean
        default: false
      reference_archive_plan:
        description: 'Inwentarz pełnego zestawu 26.3 i rozmiary (bez transferu plików)'
        type: boolean
        default: false
      reference_private_read:
        description: 'Odczyt prywatnego pliku testowego (79 bajtów, bez zapisu)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 jest już po końcu wsparcia; 22 to bieżące LTS.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Deployed cloud authorization (no real sessions)
        run: node scripts/verify-cloud-live.mjs

      - name: Production build
        run: npm run build

  reference-network:
    # Owner-triggered only; no secrets or untrusted PR-controlled URLs.
    if: github.event_name == 'workflow_dispatch' && inputs.reference_network_probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official reference and Storage connectivity
        run: node scripts/probe-reference-network.mjs

  reference-archive-plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '185239338' && inputs.reference_archive_plan
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect server-approved corpus plan without Storage writes or original transfers
        run: node scripts/inspect-reference-archive.mjs

  reference-private-read:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.reference_private_read
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and verify private probe using short-lived job identity
        run: node scripts/read-reference-probe.mjs
